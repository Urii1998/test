# --- НАСТРОЙКИ ПРОКСИ (NETLIFY + CLOUDFLARE) ---
# Теперь мы шлем запросы на ваш личный Cloudflare Worker.
# Он сам разберется с ротацией серверов и заголовками.

[[redirects]]
  from = "/api/*"
  # 👇 ВСТАВЬТЕ СЮДА ССЫЛКУ НА ВАШ WORKER 👇
  to = "https://black-block-6f08.aslanimilanda.workers.dev/"
  status = 200
  force = true
  headers = {X-From = "Netlify-Bridge"}
