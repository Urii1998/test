# --- НАСТРОЙКИ ПРОКСИ (NETLIFY) ---
# Этот файл говорит Netlify: "Когда сайт просит /api/..., сходи на сервер Piped и принеси данные".
# Если видео не грузятся, поменяйте сервер ниже (раскомментируйте другой блок).

# ВАРИАНТ 1: Kavin.rocks (Официальный, мощный, часто работает через серверные прокси)
[[redirects]]
  from = "/api/*"
  to = "https://pipedapi.kavin.rocks/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify-Proxy"}

# ВАРИАНТ 2: Tokhmi (США, часто лоялен)
# Чтобы включить этот, поставьте '#' перед строками Варианта 1 и уберите '#' здесь.
# [[redirects]]
#   from = "/api/*"
#   to = "https://pipedapi.tokhmi.xyz/:splat"
#   status = 200
#   force = true

