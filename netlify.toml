# --- НАСТРОЙКИ ПРОКСИ (NETLIFY) ---
# Обновлено на основе рекомендаций AI: используем "Low-profile" инстансы,
# которые реже блокируют IP-адреса дата-центров (как Netlify).

# ВАРИАНТ 1: Moomoo (Рекомендация AI - малоизвестный сервер)
[[redirects]]
  from = "/api/*"
  to = "https://pipedapi.moomoo.me/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify-Proxy"}

