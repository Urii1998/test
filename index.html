<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FreeView | Piped Edition</title>
    
    <!-- PWA Manifest info -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f0f">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #0f0f0f; --surface: #1e1e1e; --primary: #e53e3e; --text: #f3f4f6; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fade-enter { animation: fadeEnter 0.3s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeEnter { to { opacity: 1; transform: translateY(0); } }

        .spinner { width: 24px; height: 24px; border: 3px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: scale(1.1); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Верхняя шапка -->
    <header class="bg-[#1e1e1e] border-b border-gray-800 z-20 shrink-0">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2 cursor-pointer" onclick="app.nav('home')">
                <i class="fas fa-shield-cat text-red-500 text-xl"></i>
                <span class="font-bold text-lg hidden sm:block">FreeView</span>
            </div>

            <div class="flex-1 relative max-w-lg">
                <input type="text" id="searchInput" placeholder="Поиск (Piped API)..." 
                    class="w-full bg-[#121212] border border-gray-700 text-white pl-10 pr-4 py-2 rounded-full focus:border-red-500 focus:outline-none text-sm">
                <i class="fas fa-search absolute left-3.5 top-2.5 text-gray-500"></i>
            </div>
            
            <button onclick="app.toggleSettings()" class="text-gray-400 hover:text-white p-2">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </header>

    <!-- Основная область контента -->
    <main id="mainContainer" class="flex-1 overflow-y-auto overflow-x-hidden relative bg-[#0f0f0f] pb-20 no-scrollbar">
        
        <!-- Плеер -->
        <div id="playerOverlay" class="hidden fixed inset-0 z-50 bg-black flex flex-col">
            <div class="flex items-center justify-between p-3 bg-black/80 backdrop-blur absolute top-0 w-full z-10">
                <button onclick="player.minimize()" class="text-white p-2"><i class="fas fa-chevron-down"></i> Свернуть</button>
                <div class="flex gap-4">
                    <button onclick="player.openInNew()" class="text-xs bg-gray-800 text-gray-300 px-3 py-1 rounded border border-gray-600">
                        <i class="fas fa-external-link-alt"></i> Открыть
                    </button>
                </div>
            </div>
            
            <div class="mt-12 w-full bg-black aspect-video relative flex items-center justify-center">
                <iframe id="videoFrame" class="w-full h-full" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                <div id="playerLoader" class="absolute inset-0 flex items-center justify-center bg-black hidden">
                    <div class="spinner"></div>
                </div>
            </div>

            <div class="p-4 overflow-y-auto bg-[#1e1e1e] flex-1">
                <h2 id="plTitle" class="text-lg font-bold leading-snug mb-2"></h2>
                <div class="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
                    <div>
                        <div id="plAuthor" class="font-bold text-gray-300 text-sm mb-1"></div>
                        <div id="plViews" class="text-xs text-gray-500"></div>
                    </div>
                    <button id="subBtn" onclick="subs.toggle()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-full text-xs font-bold transition">
                        Подписаться
                    </button>
                </div>
                <div class="bg-[#121212] p-3 rounded text-sm text-gray-400 whitespace-pre-wrap" id="plDesc"></div>
            </div>
        </div>

        <!-- Контент -->
        <div class="max-w-4xl mx-auto p-4 min-h-full">
            
            <!-- Инфо-панель -->
            <div id="statusPanel" class="hidden mb-4 p-3 bg-blue-900/20 border border-blue-800 rounded-lg flex items-center justify-between text-xs">
                <span id="statusText" class="text-blue-200">Подключение к Piped...</span>
                <span id="currentServer" class="font-mono text-gray-400">...</span>
            </div>

            <!-- Табы -->
            <div id="homeTabs" class="flex gap-2 mb-6 overflow-x-auto no-scrollbar pb-1">
                <button onclick="app.loadTrends('News')" class="whitespace-nowrap bg-[#1e1e1e] border border-gray-700 px-4 py-1.5 rounded-full text-sm hover:border-red-500 transition">📰 Новости</button>
                <button onclick="app.loadTrends('Tech')" class="whitespace-nowrap bg-[#1e1e1e] border border-gray-700 px-4 py-1.5 rounded-full text-sm hover:border-red-500 transition">💻 Технологии</button>
                <button onclick="app.loadTrends('Music')" class="whitespace-nowrap bg-[#1e1e1e] border border-gray-700 px-4 py-1.5 rounded-full text-sm hover:border-red-500 transition">🎵 Музыка</button>
                <button onclick="app.loadHistory()" class="whitespace-nowrap bg-[#1e1e1e] border border-gray-700 px-4 py-1.5 rounded-full text-sm hover:border-red-500 transition">🕒 История</button>
            </div>

            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 pb-20"></div>
            
            <div id="pageLoader" class="hidden py-10 flex justify-center w-full">
                <div class="spinner"></div>
            </div>

            <div id="emptyState" class="hidden text-center mt-20 text-gray-500">
                <i class="far fa-compass text-4xl mb-3"></i>
                <p id="emptyText">Здесь пока пусто</p>
                <button onclick="app.toggleSettings()" class="mt-4 text-xs text-blue-400 underline">Сменить сервер API</button>
            </div>
        </div>
    </main>

    <!-- Навигация -->
    <nav class="fixed bottom-0 w-full bg-[#1e1e1e] border-t border-gray-800 pb-safe z-40">
        <div class="flex justify-around items-center h-14 max-w-4xl mx-auto">
            <button onclick="app.nav('home')" class="nav-item active flex flex-col items-center gap-1 text-gray-500 w-full" id="navHome">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px]">Главная</span>
            </button>
            <button onclick="app.nav('subs')" class="nav-item flex flex-col items-center gap-1 text-gray-500 w-full" id="navSubs">
                <i class="fas fa-heart text-lg"></i>
                <span class="text-[10px]">Избранное</span>
            </button>
            <button onclick="app.nav('settings')" class="nav-item flex flex-col items-center gap-1 text-gray-500 w-full" id="navSet">
                <i class="fas fa-sliders-h text-lg"></i>
                <span class="text-[10px]">Опции</span>
            </button>
        </div>
    </nav>

    <!-- Настройки -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="bg-[#1e1e1e] w-full max-w-sm rounded-xl border border-gray-700 p-5">
            <h3 class="text-xl font-bold mb-4">Настройки</h3>
            
            <div class="mb-4">
                <label class="text-xs text-gray-400 uppercase font-bold">API Сервер</label>
                <div class="flex gap-2 mt-2">
                    <input id="setServerInput" type="text" class="w-full bg-black border border-gray-700 rounded px-2 py-1 text-sm text-gray-300">
                    <button onclick="serverManager.manualSet()" class="bg-blue-600 text-white px-3 rounded text-sm">OK</button>
                </div>
                <div class="mt-2 flex items-center gap-2">
                    <input type="checkbox" id="useProxyCheck" onchange="serverManager.toggleProxy(this.checked)" class="w-4 h-4">
                    <label for="useProxyCheck" class="text-xs text-gray-300">Использовать CORS Proxy (если не грузит)</label>
                </div>
                <div class="mt-2 text-[10px] text-gray-500">
                    Рекомендуемые:
                    <br>- https://pipedapi.kavin.rocks
                    <br>- https://pipedapi.leptons.xyz
                    <br>- https://pipedapi.adminforge.de
                </div>
            </div>

            <div class="mb-6">
                <button onclick="app.clearData()" class="w-full text-left mt-2 p-2 bg-[#121212] rounded text-sm text-red-400 hover:bg-[#252525]">
                    <i class="fas fa-trash mr-2"></i> Сброс данных
                </button>
            </div>

            <button onclick="app.toggleSettings()" class="w-full bg-gray-700 py-2 rounded font-bold">Закрыть</button>
        </div>
    </div>

    <!-- Logic (Piped API Version + CORS Resilience) -->
    <script>
        const serverManager = {
            // Список надежных Piped инстансов (от Grok)
            list: [
                'https://pipedapi.kavin.rocks',
                'https://pipedapi.leptons.xyz',
                'https://pipedapi.adminforge.de',
                'https://pipedapi-libre.kavin.rocks',
                'https://api.piped.privacy.com.de',
                'https://pipedapi.drgns.space'
            ],
            current: 'https://pipedapi.kavin.rocks',
            useProxy: localStorage.getItem('fv_use_proxy') === 'true',

            async init() {
                // UI состояние чекбокса
                const checkbox = document.getElementById('useProxyCheck');
                if(checkbox) checkbox.checked = this.useProxy;

                const cached = localStorage.getItem('fv_server_piped');
                if (cached) {
                    this.current = cached;
                    ui.updateServer(cached);
                } else {
                    await this.findBest();
                }
            },

            // Умный fetch: пытается напрямую, если ошибка -> пробует через прокси
            async fetch(endpoint) {
                const targetUrl = `${this.current}${endpoint}`;
                
                // 1. Попытка прямого запроса
                if (!this.useProxy) {
                    try {
                        const res = await fetch(targetUrl, { 
                            credentials: 'omit' // Важно для CORS!
                        });
                        if (res.ok) return await res.json();
                        throw new Error('Direct fetch failed');
                    } catch (e) {
                        console.warn('Direct fetch failed, trying proxy...', e);
                        // Если прямой не прошел, автоматически пробуем прокси один раз
                    }
                }

                // 2. Fallback через прокси
                // Используем corsproxy.io как надежный вариант для JSON
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                try {
                    const res = await fetch(proxyUrl);
                    if (res.ok) return await res.json();
                    
                    // Запасной прокси (allorigins)
                    const proxyUrl2 = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                    const res2 = await fetch(proxyUrl2);
                    if (res2.ok) {
                        const data = await res2.json();
                        return JSON.parse(data.contents); // allorigins заворачивает ответ в contents
                    }
                } catch (e) {
                    throw new Error('All fetch methods failed');
                }
            },

            async check(url) {
                const c = new AbortController();
                setTimeout(() => c.abort(), 4000);
                // Простой запрос к trending
                const r = await fetch(`${url}/trending?region=RU`, { signal: c.signal, credentials: 'omit' });
                if(!r.ok) throw new Error('API Error');
                return url;
            },

            async findBest() {
                ui.status("Поиск сервера...", "blue");
                try {
                    const winner = await Promise.any(this.list.map(url => this.check(url)));
                    this.set(winner);
                    ui.status("Подключено: " + winner.split('//')[1], "green");
                    setTimeout(() => ui.hideStatus(), 2000);
                } catch (e) {
                    ui.status("Прямое соединение не удалось. Включите Прокси в настройках.", "red");
                    app.toggleSettings();
                }
            },

            manualSet() {
                const val = document.getElementById('setServerInput').value.trim().replace(/\/$/, "");
                if(val.startsWith('http')) {
                    this.set(val);
                    alert('API изменен. Перезагрузка...');
                    location.reload();
                } else {
                    alert('Нужен URL с https://');
                }
            },

            toggleProxy(val) {
                this.useProxy = val;
                localStorage.setItem('fv_use_proxy', val);
            },

            set(url) {
                this.current = url;
                localStorage.setItem('fv_server_piped', url);
                ui.updateServer(url);
            }
        };

        const subs = {
            data: JSON.parse(localStorage.getItem('fv_subs') || '[]'),
            toggle() {
                if (!player.currentVideo) return;
                const author = player.currentVideo.uploaderName || player.currentVideo.author;
                const url = player.currentVideo.uploaderUrl; 
                
                const idx = this.data.findIndex(s => s.name === author);
                const btn = document.getElementById('subBtn');

                if (idx === -1) {
                    this.data.push({ name: author, url: url, added: Date.now() });
                    btn.textContent = "Подписан";
                    btn.classList.add('bg-red-600', 'text-white');
                    btn.classList.remove('bg-gray-700');
                } else {
                    this.data.splice(idx, 1);
                    btn.textContent = "Подписаться";
                    btn.classList.remove('bg-red-600', 'text-white');
                    btn.classList.add('bg-gray-700');
                }
                localStorage.setItem('fv_subs', JSON.stringify(this.data));
            },
            isSubbed(name) { return this.data.some(s => s.name === name); }
        };

        const player = {
            currentVideo: null,
            open(videoData) {
                this.currentVideo = videoData;
                document.getElementById('playerOverlay').classList.remove('hidden');
                
                const title = videoData.title;
                const author = videoData.uploaderName || videoData.author;
                const views = this.fmtViews(videoData.views);
                
                document.getElementById('plTitle').textContent = title;
                document.getElementById('plAuthor').textContent = author;
                document.getElementById('plViews').textContent = views;
                document.getElementById('plDesc').textContent = "Загрузка...";
                
                const subBtn = document.getElementById('subBtn');
                const isSub = subs.isSubbed(author);
                subBtn.textContent = isSub ? "Подписан" : "Подписаться";
                subBtn.className = isSub ? 'bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold transition' : 'bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-full text-xs font-bold transition';

                this.loadSource(videoData.url); 
            },
            
            loadSource(videoUrl) {
                const frame = document.getElementById('videoFrame');
                const loader = document.getElementById('playerLoader');
                loader.classList.remove('hidden');
                
                const id = videoUrl.split('v=')[1];
                
                // Используем надежный Embed URL от Piped
                frame.src = `https://piped.video/embed/${id}?autoplay=1`;
                
                frame.onload = () => loader.classList.add('hidden');
                this.fetchDetails(id);
            },

            async fetchDetails(id) {
                try {
                    // Используем наш умный fetcher (он сам выберет прокси если надо)
                    const data = await serverManager.fetch(`/streams/${id}`);
                    document.getElementById('plDesc').textContent = data.description || "Нет описания";
                } catch(e) {}
            },

            minimize() {
                document.getElementById('playerOverlay').classList.add('hidden');
                document.getElementById('videoFrame').src = "";
            },
            
            openInNew() {
                const id = this.currentVideo.url.split('v=')[1];
                window.open(`https://piped.video/watch?v=${id}`, '_blank');
            },
            
            fmtViews(v) {
                if(!v) return "";
                return new Intl.NumberFormat('ru', { notation: "compact" }).format(v);
            }
        };

        const app = {
            view: 'home',
            init() {
                serverManager.init().then(() => {
                    this.loadTrends('News');
                });
                document.getElementById('searchInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.search(e.target.value);
                });
            },
            nav(target) {
                this.view = target;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                if (target === 'settings') { this.toggleSettings(); return; }
                
                document.getElementById(`nav${target.charAt(0).toUpperCase() + target.slice(1)}`).classList.add('active');
                
                if (target === 'home') {
                    document.getElementById('homeTabs').classList.remove('hidden');
                    if(document.getElementById('grid').children.length === 0) this.loadTrends('News');
                } else if (target === 'subs') {
                    document.getElementById('homeTabs').classList.add('hidden');
                    this.loadSubsFeed();
                }
            },
            
            async search(query) {
                if (!query.trim()) return;
                ui.loader(true);
                ui.clearGrid();
                try {
                    // Используем serverManager.fetch для автоматического проксирования
                    const data = await serverManager.fetch(`/search?q=${encodeURIComponent(query)}&filter=videos`);
                    ui.render(data.items);
                } catch (e) {
                    ui.error("Ошибка поиска. Попробуйте включить 'Proxy' в настройках.");
                    app.toggleSettings();
                } finally { ui.loader(false); }
            },
            
            async loadTrends(category) {
                ui.loader(true);
                ui.clearGrid();
                ui.status(`Загрузка: ${category}...`, "blue");
                
                let q = 'Новости';
                if(category === 'Tech') q = 'Технологии обзор';
                if(category === 'Music') q = 'Музыка клипы';
                
                try {
                    const data = await serverManager.fetch(`/search?q=${encodeURIComponent(q)}&filter=videos`);
                    ui.render(data.items);
                    ui.hideStatus();
                } catch(e) {
                    ui.error("Ошибка сети. Проверьте настройки.");
                } finally { ui.loader(false); }
            },

            async loadSubsFeed() {
                ui.clearGrid();
                if (subs.data.length === 0) {
                    ui.showEmpty("Нет подписок");
                    return;
                }
                const grid = document.getElementById('grid');
                subs.data.forEach(sub => {
                    const card = document.createElement('div');
                    card.className = "bg-[#1e1e1e] p-4 rounded-lg flex items-center justify-between";
                    card.innerHTML = `<div class="font-bold">${sub.name}</div><button onclick="app.search('${sub.name}')" class="bg-gray-700 px-3 py-1 rounded text-sm">Видео</button>`;
                    grid.appendChild(card);
                });
            },
            
            toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); },
            clearData() { if(confirm('Сбросить?')) { localStorage.clear(); location.reload(); } }
        };

        const ui = {
            grid: document.getElementById('grid'),
            render(items) {
                if (!items || items.length === 0) { this.showEmpty("Пусто"); return; }
                items.forEach((item, idx) => {
                    if (item.type !== 'stream' && item.type !== 'video') return;
                    
                    const el = document.createElement('div');
                    el.className = "bg-[#1e1e1e] rounded-lg overflow-hidden cursor-pointer shadow-lg fade-enter";
                    el.style.animationDelay = `${idx * 0.05}s`;
                    el.onclick = () => player.open(item);
                    
                    const elImg = document.createElement('img');
                    elImg.className = "w-full h-full object-cover opacity-90";
                    elImg.loading = "lazy";
                    
                    // Пробуем загрузить картинку. Если CORS блокирует, браузер покажет placeholder
                    // Piped картинки обычно лежат на proxy, который тоже может требовать CORS
                    elImg.src = item.thumbnail; 
                    elImg.onerror = function() { this.src = 'https://via.placeholder.com/320x180?text=No+Image'; };

                    el.innerHTML = `
                        <div class="relative aspect-video bg-black">
                            <div class="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] px-1 rounded">${this.fmtTime(item.duration)}</div>
                        </div>
                        <div class="p-3">
                            <h3 class="text-sm font-bold line-clamp-2 leading-tight mb-1">${item.title}</h3>
                            <div class="flex justify-between items-center text-xs text-gray-500">
                                <span>${item.uploaderName}</span>
                                <span>${this.fmtViews(item.views)}</span>
                            </div>
                        </div>`;
                    
                    el.querySelector('.aspect-video').prepend(elImg);
                    this.grid.appendChild(el);
                });
            },
            clearGrid() { this.grid.innerHTML = ''; document.getElementById('emptyState').classList.add('hidden'); },
            loader(state) { document.getElementById('pageLoader').classList.toggle('hidden', !state); },
            showEmpty(msg) { document.getElementById('emptyText').textContent = msg; document.getElementById('emptyState').classList.remove('hidden'); },
            error(msg) { this.status(msg, 'red'); },
            status(msg, color) {
                const p = document.getElementById('statusPanel');
                const t = document.getElementById('statusText');
                p.className = `mb-4 p-3 border rounded-lg flex items-center justify-between text-xs ${color === 'red' ? 'bg-red-900/20 border-red-800' : 'bg-blue-900/20 border-blue-800'}`;
                t.className = color === 'red' ? 'text-red-200' : 'text-blue-200';
                t.textContent = msg;
                p.classList.remove('hidden');
            },
            hideStatus() { document.getElementById('statusPanel').classList.add('hidden'); },
            updateServer(url) { 
                document.getElementById('currentServer').textContent = url.replace('https://', ''); 
                document.getElementById('setServerInput').value = url;
            },
            fmtTime(s) {
                if(!s) return "0:00";
                const m = Math.floor(s/60); const sec = s%60;
                return `${m}:${sec.toString().padStart(2,'0')}`;
            },
            fmtViews(v) {
                if(!v) return "";
                return new Intl.NumberFormat('ru', { notation: "compact" }).format(v);
            }
        };

        app.init();
    </script>
</body>
</html>
