<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FreeView | Auto-Pilot</title>
    
    <!-- PWA Manifest info -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f0f">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #050505; --surface: #121212; --primary: #00ff88; --danger: #ff3333; --text: #e0e0e0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; -webkit-tap-highlight-color: transparent; }
        
        /* Стили скроллбара */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fade-enter { animation: fadeEnter 0.4s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeEnter { to { opacity: 1; transform: translateY(0); } }

        /* Терминальный стиль для логов */
        .terminal-log { font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.4; }
        .log-success { color: #00ff88; }
        .log-error { color: #555; }
        .log-process { color: #ffff00; }
        .log-warn { color: #ffaa00; }

        .scan-line {
            width: 100%; height: 2px; background: var(--primary);
            position: absolute; top: 0; left: 0;
            animation: scan 2s linear infinite; opacity: 0.5;
        }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px rgba(0,255,136,0.5); }
        
        /* Карточка видео */
        .video-card { font-family: -apple-system, sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Экран Авто-пилота (Загрузка) -->
    <div id="bootScreen" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md">
            <h1 class="text-3xl font-bold text-white mb-2 tracking-widest text-center">FREE<span class="text-[#00ff88]">VIEW</span></h1>
            <div class="text-xs text-gray-500 text-center mb-8">SYSTEM INITIALIZATION v3.4 (Hotfix)</div>
            
            <div class="relative bg-[#111] border border-[#333] h-64 rounded-lg p-3 overflow-hidden mb-4">
                <div class="scan-line"></div>
                <div id="bootLog" class="terminal-log h-full overflow-y-auto flex flex-col-reverse"></div>
            </div>

            <div class="flex justify-between text-xs text-gray-400 font-mono">
                <span id="testedCount">Targets: 0/0</span>
                <span id="bestPing">Best: --ms</span>
            </div>
            
            <!-- Кнопка отмены, если зависнет -->
            <button onclick="autoPilot.skip()" class="mt-6 text-xs text-gray-600 hover:text-white underline w-full text-center">
                Пропустить сканирование (Использовать последний)
            </button>
        </div>
    </div>

    <!-- Верхняя шапка -->
    <header class="bg-[#121212] border-b border-[#222] z-20 shrink-0 font-sans">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2 cursor-pointer" onclick="app.nav('home')">
                <i class="fas fa-satellite-dish text-[#00ff88] text-xl"></i>
                <span class="font-bold text-lg hidden sm:block tracking-wide">FreeView</span>
            </div>

            <div class="flex-1 relative max-w-lg">
                <input type="text" id="searchInput" placeholder="Поиск видео..." 
                    class="w-full bg-black border border-[#333] text-white pl-10 pr-4 py-2 rounded-full focus:border-[#00ff88] focus:outline-none text-sm font-sans transition-colors">
                <i class="fas fa-search absolute left-3.5 top-2.5 text-gray-500"></i>
            </div>
            
            <button onclick="app.toggleSettings()" class="text-gray-400 hover:text-white p-2">
                <i class="fas fa-network-wired"></i>
            </button>
        </div>
    </header>

    <!-- Основная область контента -->
    <main id="mainContainer" class="flex-1 overflow-y-auto overflow-x-hidden relative bg-[#050505] pb-20 no-scrollbar font-sans">
        
        <!-- Плеер -->
        <div id="playerOverlay" class="hidden fixed inset-0 z-50 bg-black flex flex-col">
            <div class="flex items-center justify-between p-3 bg-black/80 backdrop-blur absolute top-0 w-full z-10">
                <button onclick="player.minimize()" class="text-white p-2 hover:text-[#00ff88]"><i class="fas fa-chevron-down"></i></button>
                <div class="flex gap-4">
                    <button onclick="autoPilot.restart()" class="text-xs bg-red-900/30 text-red-400 px-3 py-1 rounded border border-red-900 hover:bg-red-900/50">
                        <i class="fas fa-sync-alt mr-1"></i> Сменить поток
                    </button>
                    <button onclick="player.openInNew()" class="text-xs bg-gray-800 text-gray-300 px-3 py-1 rounded border border-gray-600">
                        <i class="fas fa-external-link-alt"></i>
                    </button>
                </div>
            </div>
            
            <div class="mt-12 w-full bg-black aspect-video relative flex items-center justify-center">
                <!-- Removed unsupported features from allow list -->
                <iframe id="videoFrame" class="w-full h-full" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media"></iframe>
                <div id="playerLoader" class="absolute inset-0 flex items-center justify-center bg-black hidden">
                    <div class="spinner border-t-[#00ff88]"></div>
                </div>
            </div>

            <div class="p-4 overflow-y-auto bg-[#121212] flex-1">
                <h2 id="plTitle" class="text-lg font-bold leading-snug mb-2 text-white"></h2>
                <div class="flex justify-between items-start border-b border-[#333] pb-4 mb-4">
                    <div>
                        <div id="plAuthor" class="font-bold text-[#00ff88] text-sm mb-1"></div>
                        <div id="plViews" class="text-xs text-gray-500"></div>
                    </div>
                    <button id="subBtn" onclick="subs.toggle()" class="bg-[#333] hover:bg-[#444] px-4 py-2 rounded-full text-xs font-bold transition text-white">
                        Подписаться
                    </button>
                </div>
                <div class="bg-[#0a0a0a] p-3 rounded text-sm text-gray-400 whitespace-pre-wrap border border-[#222]" id="plDesc"></div>
            </div>
        </div>

        <!-- Контент -->
        <div class="max-w-4xl mx-auto p-4 min-h-full">
            
            <!-- Статус соединения -->
            <div id="connectionStatus" class="hidden mb-4 px-3 py-2 bg-[#0a0a0a] border border-[#00ff88]/30 rounded flex items-center justify-between text-xs font-mono">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-[#00ff88] animate-pulse"></div>
                    <span id="connStatusText" class="text-[#00ff88]">CONNECTED</span>
                </div>
                <span id="serverLabel" class="text-gray-500">UNKNOWN</span>
            </div>

            <!-- Табы -->
            <div id="homeTabs" class="flex gap-2 mb-6 overflow-x-auto no-scrollbar pb-1">
                <button onclick="app.loadTrends('News')" class="whitespace-nowrap bg-[#121212] border border-[#333] px-4 py-1.5 rounded-full text-sm text-gray-300 hover:border-[#00ff88] hover:text-[#00ff88] transition">📰 Новости</button>
                <button onclick="app.loadTrends('Tech')" class="whitespace-nowrap bg-[#121212] border border-[#333] px-4 py-1.5 rounded-full text-sm text-gray-300 hover:border-[#00ff88] hover:text-[#00ff88] transition">💻 Tech</button>
                <button onclick="app.loadTrends('Music')" class="whitespace-nowrap bg-[#121212] border border-[#333] px-4 py-1.5 rounded-full text-sm text-gray-300 hover:border-[#00ff88] hover:text-[#00ff88] transition">🎵 Music</button>
                <button onclick="app.loadHistory()" class="whitespace-nowrap bg-[#121212] border border-[#333] px-4 py-1.5 rounded-full text-sm text-gray-300 hover:border-[#00ff88] hover:text-[#00ff88] transition">🕒 История</button>
            </div>

            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 pb-20"></div>
            
            <div id="pageLoader" class="hidden py-10 flex justify-center w-full">
                <div class="spinner w-8 h-8 border-4 border-[#222] border-t-[#00ff88] rounded-full animate-spin"></div>
            </div>

            <div id="emptyState" class="hidden text-center mt-20 text-gray-600">
                <i class="fas fa-ghost text-4xl mb-3"></i>
                <p id="emptyText">No Data</p>
                <button onclick="autoPilot.restart()" class="mt-4 text-xs text-[#00ff88] underline">Перезапустить сканер прокси</button>
            </div>
        </div>
    </main>

    <!-- Навигация -->
    <nav class="fixed bottom-0 w-full bg-[#121212] border-t border-[#222] pb-safe z-40 font-sans">
        <div class="flex justify-around items-center h-14 max-w-4xl mx-auto">
            <button onclick="app.nav('home')" class="nav-item active flex flex-col items-center gap-1 text-gray-500 w-full" id="navHome">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px]">Главная</span>
            </button>
            <button onclick="app.nav('subs')" class="nav-item flex flex-col items-center gap-1 text-gray-500 w-full" id="navSubs">
                <i class="fas fa-heart text-lg"></i>
                <span class="text-[10px]">Избранное</span>
            </button>
            <button onclick="app.nav('settings')" class="nav-item flex flex-col items-center gap-1 text-gray-500 w-full" id="navSet">
                <i class="fas fa-terminal text-lg"></i>
                <span class="text-[10px]">Система</span>
            </button>
        </div>
    </nav>

    <!-- Настройки -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4">
        <div class="bg-[#121212] w-full max-w-sm rounded border border-[#333] p-5 font-mono">
            <h3 class="text-xl font-bold mb-4 text-[#00ff88]">> SETTINGS</h3>
            
            <div class="mb-4">
                <label class="text-xs text-gray-500 uppercase">Current Uplink</label>
                <div class="flex gap-2 mt-1">
                    <input id="setServerInput" type="text" class="w-full bg-black border border-[#333] text-[#00ff88] px-2 py-1 text-xs font-mono" readonly>
                </div>
            </div>

            <div class="mb-4 p-3 bg-black border border-[#333] rounded">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-[#00ff88]" id="proxyStatusDot"></div>
                    <div class="text-xs text-gray-300">
                        <div>Proxy Status: <span id="proxyStatusText" class="text-white font-bold">ACTIVE</span></div>
                        <div class="text-[10px] text-gray-500 mt-1">Routing via generic fetch/cors</div>
                    </div>
                </div>
            </div>
            
            <div class="mb-4 flex items-center gap-2">
                 <input type="checkbox" id="forceProxyCheck" onchange="serverManager.toggleProxy(this.checked)" class="w-4 h-4 bg-black border-[#333]">
                 <label for="forceProxyCheck" class="text-xs text-gray-400">Force CORS Proxy Mode</label>
            </div>

            <div class="space-y-2">
                <button onclick="autoPilot.restart()" class="w-full bg-[#222] hover:bg-[#333] text-white py-2 text-xs border border-[#444] rounded">
                    > RE-SCAN NETWORK NODES
                </button>
                <button onclick="app.clearData()" class="w-full bg-[#222] hover:bg-red-900/50 text-red-400 py-2 text-xs border border-red-900/50 rounded">
                    > FLUSH LOCAL STORAGE
                </button>
            </div>

            <button onclick="app.toggleSettings()" class="w-full mt-6 bg-[#00ff88] text-black font-bold py-2 rounded text-xs hover:bg-[#00cc6a]">CLOSE CONSOLE</button>
        </div>
    </div>

    <!-- Logic -->
    <script>
        // --- 1. PROXY POOL (Optimized based on logs) ---
        const PROXY_POOL = [
            'https://api.piped.projectsegfau.lt', // ! WORKING in logs
            'https://pipedapi.kavin.rocks',
            'https://pipedapi.drgns.space',
            'https://pa.il.ax',
            'https://api.piped.privacy.com.de',
            'https://pipedapi.smnz.de',
            'https://pipedapi.ducks.party',
            'https://pipedapi.aeong.one'
        ];

        const CORS_PROXIES = [
            (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];

        // --- 2. AUTO-PILOT SYSTEM ---
        const autoPilot = {
            logEl: document.getElementById('bootLog'),
            countEl: document.getElementById('testedCount'),
            bestPingEl: document.getElementById('bestPing'),
            bootScreen: document.getElementById('bootScreen'),
            
            workingNode: null,
            workingNodeMode: false, // false = direct, true = proxy
            
            log(msg, type = 'process') {
                const line = document.createElement('div');
                line.className = `log-${type}`;
                line.innerHTML = `> ${msg}`;
                this.logEl.prepend(line);
            },

            async run() {
                this.log("Initializing Proxy Auto-Pilot v3.4...", "process");
                this.log("Scanning nodes for optimal route...", "process");
                
                let checked = 0;
                let bestPing = 9999;
                
                const checkNode = async (url) => {
                    const start = Date.now();
                    let isProxy = false;
                    let success = false;

                    // 1. Direct Check
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 2000); 
                        const res = await fetch(`${url}/trending?region=RU`, { signal: controller.signal, credentials: 'omit' });
                        clearTimeout(timeoutId);
                        if (res.ok) success = true;
                    } catch (e) {}

                    // 2. Proxy Check (если прямой не прошел)
                    if (!success) {
                        try {
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => controller.abort(), 4000); // Increased timeout for proxies
                            // Пробуем через CorsProxy
                            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url + '/trending?region=RU')}`;
                            const res = await fetch(proxyUrl, { signal: controller.signal });
                            clearTimeout(timeoutId);
                            if (res.ok) {
                                success = true;
                                isProxy = true;
                            }
                        } catch (e) {}
                    }
                    
                    // 3. Last Resort: AllOrigins (slower but sometimes works when corsproxy is blocked)
                    if (!success) {
                         try {
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => controller.abort(), 5000); 
                            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url + '/trending?region=RU')}`;
                            const res = await fetch(proxyUrl, { signal: controller.signal });
                            clearTimeout(timeoutId);
                            if (res.ok) {
                                success = true;
                                isProxy = true;
                            }
                        } catch (e) {}
                    }

                    const ping = Date.now() - start;

                    if (success) {
                        const status = isProxy ? "ONLINE (PROXY)" : "ONLINE (DIRECT)";
                        const color = isProxy ? "log-warn" : "log-success";
                        this.log(`Node [${url.split('//')[1]}] ${status} (${ping}ms)`, isProxy ? "warn" : "success");
                        
                        if (ping < bestPing) {
                            bestPing = ping;
                            this.workingNode = url;
                            this.workingNodeMode = isProxy; // Запоминаем режим
                            this.bestPingEl.textContent = `Best: ${ping}ms`;
                            this.bestPingEl.style.color = '#00ff88';
                        }
                    } else {
                        this.log(`Node [${url.split('//')[1]}] UNREACHABLE`, "error");
                    }
                    
                    checked++;
                    this.countEl.textContent = `Targets: ${checked}/${PROXY_POOL.length}`;
                };

                // Запускаем проверки последовательно для надежности или батчами
                const batchSize = 3; // Reduced batch size to prevent browser blocking
                for (let i = 0; i < PROXY_POOL.length; i += batchSize) {
                    const batch = PROXY_POOL.slice(i, i + batchSize);
                    await Promise.all(batch.map(url => checkNode(url)));
                    
                    // Если нашли сервер с хорошим пингом (прямой или прокси), останавливаемся
                    if (this.workingNode) {
                        this.log("Optimal route found. Engaging...", "success");
                        break;
                    }
                }

                if (this.workingNode) {
                    this.log(`--- CONNECTION ESTABLISHED ---`, "success");
                    setTimeout(() => this.finish(this.workingNode), 800);
                } else {
                    this.log("CRITICAL: ALL NODES FAILED.", "error");
                    this.log("Retry or check network.", "error");
                }
            },

            finish(url) {
                serverManager.set(url);
                
                // Применяем режим (Прокси или Прямой), который определил автопилот
                if (this.workingNodeMode !== undefined) {
                    serverManager.toggleProxy(this.workingNodeMode);
                }
                
                this.bootScreen.classList.add('hidden');
                app.init(); 
            },

            restart() {
                this.bootScreen.classList.remove('hidden');
                this.logEl.innerHTML = '';
                this.workingNode = null;
                this.run();
            },
            
            skip() {
                this.finish(serverManager.current || PROXY_POOL[0]);
            }
        };

        // --- 3. SERVER & DATA MANAGERS ---
        const serverManager = {
            current: null,
            useProxy: false,

            set(url) {
                this.current = url;
                localStorage.setItem('fv_server_active', url);
                
                // UI updates
                document.getElementById('serverLabel').textContent = url.replace('https://', '');
                document.getElementById('setServerInput').value = url;
                document.getElementById('connectionStatus').classList.remove('hidden');
            },
            
            toggleProxy(val) {
                this.useProxy = val;
                localStorage.setItem('fv_use_proxy', val);
                
                // Обновляем UI
                const chk = document.getElementById('forceProxyCheck');
                if(chk) chk.checked = val;
                
                const statusDot = document.getElementById('proxyStatusDot');
                const statusText = document.getElementById('proxyStatusText');
                const connText = document.getElementById('connStatusText');
                
                if(val) {
                    if(statusDot) statusDot.className = "w-3 h-3 rounded-full bg-yellow-500";
                    if(statusText) statusText.innerText = "ACTIVE (PROXY)";
                    if(connText) connText.innerText = "CONNECTED (VIA PROXY)";
                } else {
                    if(statusDot) statusDot.className = "w-3 h-3 rounded-full bg-[#00ff88]";
                    if(statusText) statusText.innerText = "INACTIVE (DIRECT)";
                    if(connText) connText.innerText = "CONNECTED (DIRECT)";
                }
            },

            async fetch(endpoint) {
                const target = `${this.current}${endpoint}`;
                
                // 1. Прямой запрос (только если прокси выключен)
                if (!this.useProxy) {
                    try {
                        const res = await fetch(target, { credentials: 'omit' });
                        if (res.ok) return await res.json();
                    } catch (e) {} 
                }

                // 2. Fallback: CORS Proxy Rotation
                for (let proxyFn of CORS_PROXIES) {
                    try {
                        const pUrl = proxyFn(target);
                        const res = await fetch(pUrl);
                        if (res.ok) {
                            const text = await res.text();
                            try { return JSON.parse(text); } catch(e) { 
                                const json = JSON.parse(text);
                                return JSON.parse(json.contents);
                            }
                        }
                    } catch (e) { continue; }
                }
                
                throw new Error("All uplinks failed");
            }
        };

        const subs = {
            data: JSON.parse(localStorage.getItem('fv_subs') || '[]'),
            toggle() {
                if (!player.currentVideo) return;
                const author = player.currentVideo.uploaderName || player.currentVideo.author;
                const url = player.currentVideo.uploaderUrl; 
                const idx = this.data.findIndex(s => s.name === author);
                const btn = document.getElementById('subBtn');

                if (idx === -1) {
                    this.data.push({ name: author, url: url, added: Date.now() });
                    btn.classList.replace('bg-[#333]', 'bg-[#00ff88]');
                    btn.classList.replace('text-white', 'text-black');
                    btn.textContent = "Подписан";
                } else {
                    this.data.splice(idx, 1);
                    btn.classList.replace('bg-[#00ff88]', 'bg-[#333]');
                    btn.classList.replace('text-black', 'text-white');
                    btn.textContent = "Подписаться";
                }
                localStorage.setItem('fv_subs', JSON.stringify(this.data));
            },
            isSubbed(name) { return this.data.some(s => s.name === name); }
        };

        const player = {
            currentVideo: null,
            open(videoData) {
                this.currentVideo = videoData;
                document.getElementById('playerOverlay').classList.remove('hidden');
                
                const title = videoData.title;
                const author = videoData.uploaderName || videoData.author;
                const views = this.fmtViews(videoData.views);
                
                document.getElementById('plTitle').textContent = title;
                document.getElementById('plAuthor').textContent = author;
                document.getElementById('plViews').textContent = views;
                document.getElementById('plDesc').textContent = "Загрузка...";
                
                const subBtn = document.getElementById('subBtn');
                const isSub = subs.isSubbed(author);
                
                if (isSub) {
                    subBtn.classList.replace('bg-[#333]', 'bg-[#00ff88]');
                    subBtn.classList.replace('text-white', 'text-black');
                    subBtn.textContent = "Подписан";
                } else {
                    subBtn.classList.replace('bg-[#00ff88]', 'bg-[#333]');
                    subBtn.classList.replace('text-black', 'text-white');
                    subBtn.textContent = "Подписаться";
                }

                this.loadSource(videoData.url); 
            },
            
            loadSource(videoUrl) {
                const frame = document.getElementById('videoFrame');
                const loader = document.getElementById('playerLoader');
                loader.classList.remove('hidden');
                
                const id = videoUrl.split('v=')[1];
                frame.src = `https://piped.video/embed/${id}?autoplay=1`;
                
                frame.onload = () => loader.classList.add('hidden');
                this.fetchDetails(id);
            },

            async fetchDetails(id) {
                try {
                    const data = await serverManager.fetch(`/streams/${id}`);
                    document.getElementById('plDesc').textContent = data.description || "Нет описания";
                } catch(e) {}
            },

            minimize() {
                document.getElementById('playerOverlay').classList.add('hidden');
                document.getElementById('videoFrame').src = "";
            },
            
            openInNew() {
                const id = this.currentVideo.url.split('v=')[1];
                window.open(`https://piped.video/watch?v=${id}`, '_blank');
            },
            
            fmtViews(v) {
                if(!v) return "";
                return new Intl.NumberFormat('ru', { notation: "compact" }).format(v);
            }
        };

        const app = {
            view: 'home',
            init() {
                this.loadTrends('News');
                
                document.getElementById('searchInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.search(e.target.value);
                });

                // Init UI state
                const chk = document.getElementById('forceProxyCheck');
                if(chk) chk.checked = serverManager.useProxy;
                serverManager.toggleProxy(serverManager.useProxy);
            },
            nav(target) {
                this.view = target;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                if (target === 'settings') { this.toggleSettings(); return; }
                
                document.getElementById(`nav${target.charAt(0).toUpperCase() + target.slice(1)}`).classList.add('active');
                
                if (target === 'home') {
                    document.getElementById('homeTabs').classList.remove('hidden');
                    if(document.getElementById('grid').children.length === 0) this.loadTrends('News');
                } else if (target === 'subs') {
                    document.getElementById('homeTabs').classList.add('hidden');
                    this.loadSubsFeed();
                }
            },
            
            async search(query) {
                if (!query.trim()) return;
                ui.loader(true);
                ui.clearGrid();
                try {
                    const data = await serverManager.fetch(`/search?q=${encodeURIComponent(query)}&filter=videos`);
                    ui.render(data.items);
                } catch (e) {
                    ui.error("Ошибка связи. Попробуйте перезапустить сканер (Настройки -> Re-Scan).");
                } finally { ui.loader(false); }
            },
            
            async loadTrends(category) {
                ui.loader(true);
                ui.clearGrid();
                
                let q = 'Новости';
                if(category === 'Tech') q = 'Technology Review';
                if(category === 'Music') q = 'Music Video 2025';
                
                try {
                    const data = await serverManager.fetch(`/search?q=${encodeURIComponent(q)}&filter=videos`);
                    ui.render(data.items);
                } catch(e) {
                    ui.error("Нет соединения с API. Проверьте настройки.");
                } finally { ui.loader(false); }
            },

            async loadSubsFeed() {
                ui.clearGrid();
                if (subs.data.length === 0) {
                    ui.showEmpty("Нет подписок");
                    return;
                }
                const grid = document.getElementById('grid');
                [...subs.data].reverse().forEach(sub => {
                    const card = document.createElement('div');
                    card.className = "bg-[#121212] p-4 rounded flex items-center justify-between border border-[#333]";
                    card.innerHTML = `<div class="font-bold text-gray-300 text-sm">${sub.name}</div><button onclick="app.search('${sub.name}')" class="bg-[#222] hover:bg-[#333] px-3 py-1 rounded text-xs border border-[#444] text-[#00ff88]">Открыть</button>`;
                    grid.appendChild(card);
                });
            },
            
            toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); },
            clearData() { if(confirm('Сбросить?')) { localStorage.clear(); location.reload(); } }
        };

        window.onload = () => {
            autoPilot.run();
        };
    </script>
</body>
</html>
