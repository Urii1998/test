<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FreeView | Hive Mind v5.0</title>
    
    <!-- PWA Manifest info -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #000000; --surface: #0f0f0f; --primary: #00ff88; --danger: #ff3333; --text: #e0e0e0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; -webkit-tap-highlight-color: transparent; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fade-enter { animation: fadeEnter 0.4s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeEnter { to { opacity: 1; transform: translateY(0); } }

        .terminal-log { font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.4; }
        .log-success { color: #00ff88; }
        .log-error { color: #ff3333; }
        .log-process { color: #ffff00; }
        .log-warn { color: #ffaa00; }
        .log-info { color: #00bfff; }

        .scan-line {
            width: 100%; height: 2px; background: var(--primary);
            position: absolute; top: 0; left: 0;
            animation: scan 2s linear infinite; opacity: 0.5;
        }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .video-card { font-family: -apple-system, sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Экран Авто-пилота -->
    <div id="bootScreen" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md">
            <h1 class="text-3xl font-bold text-white mb-2 tracking-widest text-center">FREE<span class="text-[#00ff88]">VIEW</span></h1>
            <div class="text-xs text-gray-500 text-center mb-8">HIVE MIND PROTOCOL v5.0</div>
            
            <div class="relative bg-[#0a0a0a] border border-[#333] h-64 rounded-lg p-3 overflow-hidden mb-4">
                <div class="scan-line"></div>
                <div id="bootLog" class="terminal-log h-full overflow-y-auto flex flex-col-reverse"></div>
            </div>

            <div class="flex justify-between text-xs text-gray-400 font-mono">
                <span id="testedCount">Targets: 0/0</span>
                <span id="bestPing">Best: --ms</span>
            </div>
            
            <button onclick="autoPilot.skip()" class="mt-6 text-xs text-gray-600 hover:text-white underline w-full text-center">
                Экстренный запуск (Offline Mode)
            </button>
        </div>
    </div>

    <!-- Шапка -->
    <header class="bg-[#0f0f0f] border-b border-[#222] z-20 shrink-0 font-sans">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2 cursor-pointer" onclick="app.nav('home')">
                <i class="fas fa-shield-cat text-[#00ff88] text-xl"></i>
                <span class="font-bold text-lg hidden sm:block tracking-wide">FreeView</span>
            </div>

            <div class="flex-1 relative max-w-lg">
                <input type="text" id="searchInput" placeholder="Поиск..." 
                    class="w-full bg-black border border-[#333] text-white pl-10 pr-4 py-2 rounded-full focus:border-[#00ff88] focus:outline-none text-sm font-sans transition-colors">
                <i class="fas fa-search absolute left-3.5 top-2.5 text-gray-500"></i>
            </div>
            
            <button onclick="app.toggleSettings()" class="text-gray-400 hover:text-white p-2">
                <i class="fas fa-network-wired"></i>
            </button>
        </div>
    </header>

    <!-- Контент -->
    <main id="mainContainer" class="flex-1 overflow-y-auto overflow-x-hidden relative bg-[#050505] pb-20 no-scrollbar font-sans">
        
        <!-- Плеер -->
        <div id="playerOverlay" class="hidden fixed inset-0 z-50 bg-black flex flex-col">
            <div class="flex items-center justify-between p-3 bg-black/80 backdrop-blur absolute top-0 w-full z-10">
                <button onclick="player.minimize()" class="text-white p-2 hover:text-[#00ff88]"><i class="fas fa-chevron-down"></i></button>
                <div class="flex gap-4">
                    <button onclick="autoPilot.restart()" class="text-xs bg-red-900/30 text-red-400 px-3 py-1 rounded border border-red-900 hover:bg-red-900/50">
                        <i class="fas fa-sync-alt mr-1"></i> Fix Stream
                    </button>
                    <button onclick="player.openInNew()" class="text-xs bg-gray-800 text-gray-300 px-3 py-1 rounded border border-gray-600">
                        <i class="fas fa-external-link-alt"></i>
                    </button>
                </div>
            </div>
            
            <div class="mt-12 w-full bg-black aspect-video relative flex items-center justify-center">
                <iframe id="videoFrame" class="w-full h-full" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media"></iframe>
                <div id="playerLoader" class="absolute inset-0 flex items-center justify-center bg-black hidden">
                    <div class="spinner border-t-[#00ff88] w-8 h-8 rounded-full border-4 animate-spin"></div>
                </div>
            </div>

            <div class="p-4 overflow-y-auto bg-[#0f0f0f] flex-1">
                <h2 id="plTitle" class="text-lg font-bold leading-snug mb-2 text-white"></h2>
                <div class="flex justify-between items-start border-b border-[#333] pb-4 mb-4">
                    <div>
                        <div id="plAuthor" class="font-bold text-[#00ff88] text-sm mb-1"></div>
                        <div id="plViews" class="text-xs text-gray-500"></div>
                    </div>
                    <button id="subBtn" onclick="subs.toggle()" class="bg-[#333] hover:bg-[#444] px-4 py-2 rounded-full text-xs font-bold transition text-white">
                        Подписаться
                    </button>
                </div>
                <div class="bg-[#0a0a0a] p-3 rounded text-sm text-gray-400 whitespace-pre-wrap border border-[#222]" id="plDesc"></div>
            </div>
        </div>

        <!-- Сетка видео -->
        <div class="max-w-4xl mx-auto p-4 min-h-full">
            
            <div id="connectionStatus" class="hidden mb-4 px-3 py-2 bg-[#0a0a0a] border border-[#00ff88]/30 rounded flex items-center justify-between text-xs font-mono">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-[#00ff88] animate-pulse"></div>
                    <span id="connStatusText" class="text-[#00ff88]">CONNECTED</span>
                </div>
                <span id="serverLabel" class="text-gray-500">UNKNOWN</span>
            </div>

            <div id="homeTabs" class="flex gap-2 mb-6 overflow-x-auto no-scrollbar pb-1">
                <button onclick="app.loadTrends('News')" class="whitespace-nowrap bg-[#0f0f0f] border border-[#333] px-4 py-1.5 rounded-full text-sm text-gray-300 hover:border-[#00ff88] hover:text-[#00ff88] transition">📰 Новости</button>
                <button onclick="app.loadTrends('Tech')" class="whitespace-nowrap bg-[#0f0f0f] border border-[#333] px-4 py-1.5 rounded-full text-sm text-gray-300 hover:border-[#00ff88] hover:text-[#00ff88] transition">💻 Tech</button>
                <button onclick="app.loadTrends('Music')" class="whitespace-nowrap bg-[#0f0f0f] border border-[#333] px-4 py-1.5 rounded-full text-sm text-gray-300 hover:border-[#00ff88] hover:text-[#00ff88] transition">🎵 Music</button>
                <button onclick="app.loadHistory()" class="whitespace-nowrap bg-[#0f0f0f] border border-[#333] px-4 py-1.5 rounded-full text-sm text-gray-300 hover:border-[#00ff88] hover:text-[#00ff88] transition">🕒 История</button>
            </div>

            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 pb-20"></div>
            
            <div id="pageLoader" class="hidden py-10 flex justify-center w-full">
                <div class="spinner w-8 h-8 border-4 border-[#222] border-t-[#00ff88] rounded-full animate-spin"></div>
            </div>

            <div id="emptyState" class="hidden text-center mt-20 text-gray-600">
                <i class="fas fa-ghost text-4xl mb-3"></i>
                <p id="emptyText">No Data</p>
                <button onclick="autoPilot.restart()" class="mt-4 text-xs text-[#00ff88] underline">Перезапустить сканер</button>
            </div>
        </div>
    </main>

    <!-- Навигация -->
    <nav class="fixed bottom-0 w-full bg-[#0f0f0f] border-t border-[#222] pb-safe z-40 font-sans">
        <div class="flex justify-around items-center h-14 max-w-4xl mx-auto">
            <button onclick="app.nav('home')" class="nav-item active flex flex-col items-center gap-1 text-gray-500 w-full" id="navHome">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px]">Главная</span>
            </button>
            <button onclick="app.nav('subs')" class="nav-item flex flex-col items-center gap-1 text-gray-500 w-full" id="navSubs">
                <i class="fas fa-heart text-lg"></i>
                <span class="text-[10px]">Избранное</span>
            </button>
            <button onclick="app.nav('settings')" class="nav-item flex flex-col items-center gap-1 text-gray-500 w-full" id="navSet">
                <i class="fas fa-terminal text-lg"></i>
                <span class="text-[10px]">Система</span>
            </button>
        </div>
    </nav>

    <!-- Настройки -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4">
        <div class="bg-[#0f0f0f] w-full max-w-sm rounded border border-[#333] p-5 font-mono">
            <h3 class="text-xl font-bold mb-4 text-[#00ff88]">> SYSTEM CONFIG</h3>
            
            <div class="mb-4">
                <label class="text-xs text-gray-500 uppercase">Current Node</label>
                <input id="setServerInput" type="text" class="w-full bg-black border border-[#333] text-[#00ff88] px-2 py-1 text-xs font-mono mt-1" readonly>
            </div>

            <div class="mb-4 p-3 bg-black border border-[#333] rounded">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-[#00ff88]" id="proxyStatusDot"></div>
                    <div class="text-xs text-gray-300">
                        <div>Mode: <span id="proxyStatusText" class="text-white font-bold">AUTO</span></div>
                        <div class="text-[10px] text-gray-500 mt-1">Hive Mind Discovery Active</div>
                    </div>
                </div>
            </div>
            
            <div class="space-y-2">
                <button onclick="autoPilot.restart()" class="w-full bg-[#222] hover:bg-[#333] text-white py-2 text-xs border border-[#444] rounded">
                    > RE-SCAN GLOBAL NETWORK
                </button>
                <button onclick="app.clearData()" class="w-full bg-[#222] hover:bg-red-900/50 text-red-400 py-2 text-xs border border-red-900/50 rounded">
                    > FLUSH DATA
                </button>
            </div>

            <button onclick="app.toggleSettings()" class="w-full mt-6 bg-[#00ff88] text-black font-bold py-2 rounded text-xs hover:bg-[#00cc6a]">CLOSE</button>
        </div>
    </div>

    <!-- Core Logic -->
    <script>
        // --- 1. TARGET POOL (Seed Nodes) ---
        // Изначальный список, если реестр недоступен
        const SEED_TARGETS = [
            { url: 'https://api.piped.projectsegfau.lt', type: 'piped' },
            { url: 'https://pipedapi.tokhmi.xyz', type: 'piped' },
            { url: 'https://inv.nadeko.net/api/v1', type: 'invidious' },
            { url: 'https://yewtu.be/api/v1', type: 'invidious' }
        ];

        let LIVE_TARGETS = [...SEED_TARGETS];

        // --- 2. PROXY ROTATOR ---
        const PROXIES = [
            (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
            (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
            (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
            (u) => `https://thingproxy.freeboard.io/fetch/${u}`
        ];

        // --- 3. AUTO-PILOT SYSTEM ---
        const autoPilot = {
            logEl: document.getElementById('bootLog'),
            countEl: document.getElementById('testedCount'),
            bestPingEl: document.getElementById('bestPing'),
            bootScreen: document.getElementById('bootScreen'),
            
            node: null,
            mode: 'direct', // direct, proxy
            type: 'piped',  // piped, invidious

            log(msg, style = 'process') {
                const div = document.createElement('div');
                div.className = `log-${style}`;
                div.innerText = `> ${msg}`;
                this.logEl.prepend(div);
            },

            async fetchGlobalRegistry() {
                this.log("Connecting to Global Hive Mind...", "info");
                try {
                    // Используем надежный прокси для получения списка серверов
                    const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.invidious.io/instances.json?sort_by=type,health'));
                    const data = await r.json();
                    
                    // Фильтруем: только HTTPS, CORS разрешен, API доступен
                    const newNodes = data
                        .filter(i => i[1].type === 'https' && i[1].cors === true && i[1].api === true)
                        .map(i => ({ url: i[0], type: 'invidious' })) // Invidious реестр дает invidious ноды
                        .slice(0, 6); // Берем топ-6 лучших
                    
                    if(newNodes.length > 0) {
                        this.log(`Registry: Found ${newNodes.length} verified nodes.`, "success");
                        // Добавляем новые ноды в начало списка проверки
                        LIVE_TARGETS = [...newNodes, ...SEED_TARGETS];
                    } else {
                        throw new Error('No valid nodes');
                    }
                } catch(e) {
                    this.log("Registry offline. Using embedded seeds.", "warn");
                }
            },

            async run() {
                this.log("Initializing System v5.0...", "process");
                
                // 1. Попытка скачать свежий список серверов
                await this.fetchGlobalRegistry();

                this.log(`Scanning ${LIVE_TARGETS.length} targets...`, "process");
                
                let bestPing = 9999;
                let checked = 0;

                const check = async (target) => {
                    const tStart = Date.now();
                    let working = false;
                    let isProxy = false;
                    
                    // Endpoint для теста
                    const testPath = target.type === 'piped' ? '/trending?region=RU' : '/trending?region=RU';
                    const fullUrl = target.url + testPath;

                    // 1. Direct Fetch
                    try {
                        const c = new AbortController();
                        setTimeout(() => c.abort(), 2000);
                        const r = await fetch(fullUrl, { signal: c.signal, credentials: 'omit' });
                        if(r.ok) { working = true; }
                    } catch(e) {}

                    // 2. Proxy Fetch (если Direct упал)
                    if (!working) {
                        for (let proxyFn of PROXIES) {
                            try {
                                const c = new AbortController();
                                setTimeout(() => c.abort(), 3500); 
                                const pUrl = proxyFn(fullUrl);
                                const r = await fetch(pUrl, { signal: c.signal });
                                if(r.ok) { working = true; isProxy = true; break; }
                            } catch(e) {}
                        }
                    }

                    const ping = Date.now() - tStart;

                    if (working) {
                        const style = isProxy ? 'warn' : 'success';
                        const label = isProxy ? 'ONLINE (PROXY)' : 'ONLINE (DIRECT)';
                        this.log(`[${target.url.replace('https://','').split('/')[0]}] ${label} ${ping}ms`, style);
                        
                        if (ping < bestPing) {
                            bestPing = ping;
                            this.node = target.url;
                            this.type = target.type;
                            this.mode = isProxy ? 'proxy' : 'direct';
                            
                            this.bestPingEl.textContent = `Best: ${ping}ms`;
                            this.bestPingEl.style.color = '#00ff88';
                        }
                    } else {
                        this.log(`[${target.url.replace('https://','').split('/')[0]}] FAILED`, 'error');
                    }
                    
                    checked++;
                    this.countEl.textContent = `Scanned: ${checked}/${LIVE_TARGETS.length}`;
                };

                // Сканируем батчами
                const batchSize = 3;
                for(let i=0; i<LIVE_TARGETS.length; i+=batchSize) {
                    await Promise.all(LIVE_TARGETS.slice(i, i+batchSize).map(check));
                    // Если нашли хороший (<1s), выходим
                    if(this.node && bestPing < 1200) break;
                }

                if(this.node) {
                    this.log("OPTIMAL ROUTE LOCKED.", "success");
                    this.finish();
                } else {
                    this.log("ALL NODES FAILED. RETRYING...", "error");
                    // Экстренный фоллбэк
                    this.node = SEED_TARGETS[0].url;
                    this.type = SEED_TARGETS[0].type;
                    this.mode = 'proxy';
                    setTimeout(() => this.finish(), 2000);
                }
            },

            finish() {
                net.config(this.node, this.mode, this.type);
                this.bootScreen.classList.add('hidden');
                app.init();
            },

            restart() {
                this.bootScreen.classList.remove('hidden');
                this.logEl.innerHTML = '';
                this.node = null;
                this.run();
            },

            skip() {
                this.node = SEED_TARGETS[0].url;
                this.type = SEED_TARGETS[0].type;
                this.mode = 'proxy';
                this.finish();
            }
        };

        // --- 4. NETWORKING CORE ---
        const net = {
            baseUrl: null,
            mode: 'direct', // direct, proxy
            type: 'piped',  // piped, invidious

            config(url, mode, type) {
                this.baseUrl = url;
                this.mode = mode;
                this.type = type;
                
                // UI
                document.getElementById('setServerInput').value = url;
                document.getElementById('connStatusText').textContent = `CONNECTED (${mode.toUpperCase()})`;
                document.getElementById('serverLabel').textContent = type.toUpperCase();
                document.getElementById('connectionStatus').classList.remove('hidden');
                
                const dot = document.getElementById('proxyStatusDot');
                const txt = document.getElementById('proxyStatusText');
                if(mode === 'proxy') {
                    dot.className = "w-3 h-3 rounded-full bg-yellow-500";
                    txt.textContent = "PROXY RELAY";
                } else {
                    dot.className = "w-3 h-3 rounded-full bg-[#00ff88]";
                    txt.textContent = "DIRECT";
                }
            },

            async get(endpoint) {
                // Адаптация URL
                let path = endpoint;
                if(this.type === 'invidious' && endpoint.includes('filter=videos')) {
                    path = endpoint.replace('filter=videos', 'type=video');
                }

                const target = `${this.baseUrl}${path}`;

                if (this.mode === 'direct') {
                    try {
                        const r = await fetch(target, { credentials: 'omit' });
                        if(r.ok) return await r.json();
                    } catch(e) {}
                }

                for (let proxyFn of PROXIES) {
                    try {
                        const r = await fetch(proxyFn(target));
                        if(r.ok) {
                            const txt = await r.text();
                            try { return JSON.parse(txt); } 
                            catch(e) { 
                                const j = JSON.parse(txt);
                                return JSON.parse(j.contents); 
                            }
                        }
                    } catch(e) {}
                }
                throw new Error('Network Dead');
            }
        };

        // --- 5. APP LOGIC ---
        const subs = {
            data: JSON.parse(localStorage.getItem('fv_subs') || '[]'),
            toggle(video) {
                const author = video.uploaderName || video.author;
                const idx = this.data.findIndex(s => s.name === author);
                if (idx === -1) {
                    this.data.push({ name: author, added: Date.now() });
                } else {
                    this.data.splice(idx, 1);
                }
                localStorage.setItem('fv_subs', JSON.stringify(this.data));
                this.updateBtn(author);
            },
            isSubbed(name) { return this.data.some(s => s.name === name); },
            updateBtn(name) {
                const btn = document.getElementById('subBtn');
                if(this.isSubbed(name)) {
                    btn.textContent = "Подписан";
                    btn.classList.replace('bg-[#333]', 'bg-[#00ff88]');
                    btn.classList.replace('text-white', 'text-black');
                } else {
                    btn.textContent = "Подписаться";
                    btn.classList.replace('bg-[#00ff88]', 'bg-[#333]');
                    btn.classList.replace('text-black', 'text-white');
                }
            }
        };

        const player = {
            open(item) {
                document.getElementById('playerOverlay').classList.remove('hidden');
                
                const title = item.title;
                const author = item.uploaderName || item.author;
                const views = this.fmt(item.views || item.viewCount);
                const id = item.url ? item.url.split('v=')[1] : item.videoId;

                document.getElementById('plTitle').textContent = title;
                document.getElementById('plAuthor').textContent = author;
                document.getElementById('plViews').textContent = views;
                document.getElementById('plDesc').textContent = "Загрузка...";
                
                // Embed URL
                let embedUrl = `https://piped.video/embed/${id}?autoplay=1`;
                if(net.type === 'invidious') {
                   // Для Invidious используем надежный инстанс для embed
                   embedUrl = `https://yewtu.be/embed/${id}?autoplay=1`; 
                }

                const frame = document.getElementById('videoFrame');
                frame.src = embedUrl;
                document.getElementById('playerLoader').classList.remove('hidden');
                frame.onload = () => document.getElementById('playerLoader').classList.add('hidden');

                subs.updateBtn(author);
                document.getElementById('subBtn').onclick = () => subs.toggle(item);

                this.loadDetails(id);
                this.currentId = id;
            },
            
            async loadDetails(id) {
                try {
                    const path = net.type === 'piped' ? `/streams/${id}` : `/videos/${id}`;
                    const data = await net.get(path);
                    document.getElementById('plDesc').textContent = data.description || "Нет описания";
                } catch(e) {}
            },

            minimize() {
                document.getElementById('playerOverlay').classList.add('hidden');
                document.getElementById('videoFrame').src = "";
            },
            
            openInNew() {
                window.open(`https://piped.video/watch?v=${this.currentId}`, '_blank');
            },

            fmt(n) {
                if(!n) return "";
                return new Intl.NumberFormat('ru', { notation: "compact" }).format(n);
            }
        };

        const app = {
            init() {
                this.loadTrends('News');
                document.getElementById('searchInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.search(e.target.value);
                });
            },

            nav(target) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                if (target === 'settings') { this.toggleSettings(); return; }
                
                document.getElementById(`nav${target.charAt(0).toUpperCase() + target.slice(1)}`).classList.add('active');
                
                const tabs = document.getElementById('homeTabs');
                const grid = document.getElementById('grid');
                
                if (target === 'home') {
                    tabs.classList.remove('hidden');
                    if(grid.children.length === 0) this.loadTrends('News');
                } else if (target === 'subs') {
                    tabs.classList.add('hidden');
                    this.loadSubs();
                }
            },

            async search(q) {
                if(!q.trim()) return;
                this.loading(true);
                try {
                    const data = await net.get(`/search?q=${encodeURIComponent(q)}&filter=videos`);
                    const items = Array.isArray(data) ? data : data.items;
                    this.render(items);
                } catch(e) { this.error(); }
                this.loading(false);
            },

            async loadTrends(cat) {
                this.loading(true);
                let q = 'Новости';
                if(cat === 'Tech') q = 'Technology';
                if(cat === 'Music') q = 'Music';
                
                try {
                    const data = await net.get(`/search?q=${encodeURIComponent(q)}&filter=videos`);
                    const items = Array.isArray(data) ? data : data.items;
                    this.render(items);
                } catch(e) { this.error(); }
                this.loading(false);
            },

            async loadSubs() {
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                if(subs.data.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }
                
                [...subs.data].reverse().forEach(s => {
                    const div = document.createElement('div');
                    div.className = "bg-[#0f0f0f] p-4 rounded border border-[#333] flex justify-between items-center";
                    div.innerHTML = `<span class="font-bold">${s.name}</span><button onclick="app.search('${s.name}')" class="text-xs bg-[#222] px-3 py-1 rounded text-[#00ff88]">Видео</button>`;
                    grid.appendChild(div);
                });
            },

            render(items) {
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                document.getElementById('emptyState').classList.add('hidden');
                
                if(!items || items.length === 0) return;

                items.forEach((item, i) => {
                    if(item.type !== 'video' && item.type !== 'stream') return;
                    
                    const el = document.createElement('div');
                    el.className = "video-card bg-[#0f0f0f] rounded overflow-hidden cursor-pointer fade-enter border border-[#222] hover:border-[#444]";
                    el.style.animationDelay = `${i * 0.05}s`;
                    el.onclick = () => player.open(item);
                    
                    let img = item.thumbnail || item.videoThumbnails?.[0]?.url;
                    if(img && !img.startsWith('http')) img = net.baseUrl + img;
                    if(!img) img = 'https://via.placeholder.com/320x180?text=No+Img';

                    const dur = item.duration ? player.fmt(item.duration) : (item.lengthSeconds ? player.fmt(item.lengthSeconds) : '');

                    el.innerHTML = `
                        <div class="relative aspect-video bg-black">
                            <img src="${img}" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition" loading="lazy" onerror="this.src='https://via.placeholder.com/320x180?text=Err'">
                            <div class="absolute bottom-2 right-2 bg-black/80 text-[#00ff88] text-[10px] px-1 rounded font-mono border border-[#00ff88]/30">${dur}</div>
                        </div>
                        <div class="p-3">
                            <h3 class="text-sm font-bold line-clamp-2 leading-tight mb-1 text-gray-200">${item.title}</h3>
                            <div class="flex justify-between items-center text-[10px] text-gray-500 font-mono mt-2">
                                <span>${item.uploaderName || item.author}</span>
                                <span>${player.fmt(item.views || item.viewCount)}</span>
                            </div>
                        </div>`;
                    grid.appendChild(el);
                });
            },

            loading(state) {
                document.getElementById('pageLoader').classList.toggle('hidden', !state);
                document.getElementById('grid').innerHTML = state ? '' : document.getElementById('grid').innerHTML;
            },
            
            error() {
                document.getElementById('grid').innerHTML = `<div class="col-span-full text-center py-10 text-red-500 font-mono">CONNECTION LOST. TRY RESTARTING SYSTEM.</div>`;
            },
            
            toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); },
            clearData() { if(confirm('RESET?')) { localStorage.clear(); location.reload(); } }
        };

        window.onload = () => autoPilot.run();
    </script>
</body>
</html>
